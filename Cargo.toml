[workspace]
members = [
  "crates/media-model",
  "crates/capture-graph",
  "crates/persistence",
  "crates/capture-core",
  "crates/media-index",
  "crates/media-visual",
  "crates/capture-intelligence",
  "crates/magic-search",
  "crates/moment-brain",
  "crates/studio-brain",
  "crates/delivery-brain",
  "crates/edit-bridge",
  "crates/storage",
  "crates/ingest",
  "crates/integrity",
  "apps/desktop/src-tauri",
  "research/capture-intelligence-bench",
  "research/magic-search-bench",
  "research/moment-brain-bench",
  "research/studio-brain-bench",
  "research/delivery-brain-bench",
  "research/edit-bridge-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.78"
authors = ["CaptureOS Contributors"]

[workspace.dependencies]
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
kamadak-exif = "0.6.1"
libc = "0.2"
proptest = "1.5"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = "0.10"
unicode-normalization = "0.1"
